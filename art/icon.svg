<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>Icon app - chu tieu Lang Mai</title>
  <desc>Nguon de sinh icon: nen squircle nau Lang Mai, chu tieu ngoi kiet gia o giua. Rasterize bang qlmanage roi chay `npm run tauri icon`.</desc>

  <defs>
