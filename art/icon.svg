      <stop offset="0" stop-color="#F4E6D4" stop-opacity="0.22"></stop>
      <stop offset="1" stop-color="#F4E6D4" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"></rect>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#halo)"></rect>

  
