name: Báo lỗi
description: Có gì đó không chạy đúng
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo. Càng cụ thể thì càng dễ tìm ra nguyên nhân.

  - type: input
    id: version
    attributes:
      label: Phiên bản
      description: Xem trong tên file cài đặt, ví dụ 2.1.0
      placeholder: "2.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Hệ điều hành
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: Chuyện gì xảy ra
      description: Bạn đang làm gì, và kết quả ra sao
      placeholder: |
        Tôi bấm "Thỉnh chuông" thì...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Bạn mong nó xảy ra thế nào
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Các bước làm lại được lỗi
      description: Nếu lỗi chỉ thi thoảng mới gặp, cứ ghi vậy.
      placeholder: |
        1. Mở Cài đặt
        2. ...
    validations:
      required: false
